<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta property="og:title" content="Juego de Adivinar numero aleatorio">
  <meta property="og:description" content="En esta página puedes jugar a adivinar un numero aleatorio">
  <title>Juego de adivinar un número random</title>
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.11.2/css/all.css" />
  <link rel="stylesheet" href="css/w3.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <main class="w3-margin w3-border w3-border-lightgray w3-border-2 w3-padding">
    <header>
      <h1 tabindex="0">Juego a&lt;div&gt;iNa!!
        <!-- NOTA: el boton de contraste sale diferente porque no tiene relleno blanco (y no es el mismo que el del video) -->
        <button id="contraste" tabindex="0" aria-hidden="false"><img src="img/contraste.png"
            alt="Boton para cambiar el contraste">
        </button>
        <button id="aumentar" tabindex="0">A<sup>+</sup></button>
        <button id="disminuir" tabindex="0">A<sup>-</sup></button>
      </h1>
    </header>
    <!-- PASO 1 -->
    <div id="paso1" tabindex="0">
      <label class="ajustable" tabindex="0">Antes de empezar, por favor dinos tu nombre:</label>
      <input type="text" name="nombre" id="nombre" class="w3-input ajustable" />
      <button type="button" id="continuar1" class="w3-button w3-teal ajustable">Continuar</button>
      <small id="error1" name="error1" class="ajustable" tabindex="0"></small>
    </div>
    <!-- PASO 2 -->
    <div id="paso2" class="hidden" tabindex="0">
      <p id="enunciado" class="ajustable" tabindex="0"></p>
      <div id="num1" class="w3-container w3-margin-top">
        <label for="numMin" class="ajustable" tabindex="0">Escribe un número entre el 1 y el 10:</label>
        <input type="text" name="numMin" id="numMin" class="w3-input ajustable" value="10" /><button type="button"
          id="continuar2" class="w3-button w3-teal ajustable">
          Continuar</button>
        <small id="error2" name="error2" class="ajustable" tabindex="0"></small>
      </div>
      <div id="num2" class="w3-container w3-margin-top hidden ajustable">
        <label for="numMax" class="ajustable" tabindex="0">Escribe un número entre el 30 y el 40:</label>
        <input type="text" name="numMax" id="numMax" class="w3-input ajustable" value="30" />
        <button type="button" id="continuar3" class="w3-button w3-teal ajustable">Continuar</button>
        <small id="error3" name="error3" class="ajustable" tabindex="0"></small>
      </div>
    </div>
    <!-- EL JUEGO -->
    <div id="juegoBtns"></div>
    <section id="error4" name="error4" class="ajustable" tabindex="0"></section>
    <div id="deNuevo" class="hidden">
      <p class="w3-text ajustable">¿Te gustaría volver a jugar?</p>
      <div>
        <button id="reset" class="w3-button w3-teal ajustable">Volver a jugar</button>
        <button id="no" class="w3-button w3-red ajustable">Salir</button>
      </div>
    </div>
  </main>
  <script src="js/app.js"></script>
</body>
<footer>
  <script src="https://kit.fontawesome.com/2c36e9b7b1.js" crossorigin="anonymous"></script>

</footer>

</html>
